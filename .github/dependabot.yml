# Houdt de actions in .github/workflows actueel. De workflows zetten actions vast op
# een commit-hash; Dependabot opent een pull request zodra er een nieuwere versie
# is, met de nieuwe hash en het versienummer in het commentaar erachter.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
