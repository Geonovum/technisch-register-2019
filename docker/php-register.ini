; PHP-instellingen van het technisch register, bovenop php.ini-production.
expose_php = Off
; index.php leest repos.json en cluster.json van GitHub, de webhook downloadt releases
allow_url_fopen = On
default_socket_timeout = 60
memory_limit = 256M
; fouten naar de log van de container, niet naar de bezoeker
display_errors = Off
log_errors = On
