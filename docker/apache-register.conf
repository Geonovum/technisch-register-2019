# Virtual host van het technisch register in de container.
# De regels voor de artefactmappen en de rewrite-regels komen uit conf/apache2/,
# dezelfde bestanden als op de server.

# De publieke naam, met schema, zet de entrypoint uit REGISTER_BASE_URL. Met
# UseCanonicalName On maakt Apache daar zijn omleidingen mee, zodat die achter een
# proxy die TLS afhandelt naar https://<domein>/ gaan en niet naar http://...:8080/.
<VirtualHost *:8080>
    ServerName ${REGISTER_SERVER_NAME}
    UseCanonicalName On

    DocumentRoot /var/www/geostandaarden/v2/production
    <Directory "/var/www/geostandaarden/v2/production">
        Options Indexes
        Require all granted
    </Directory>

    Include /etc/apache2/register/artefact-directories.txt
    Include /etc/apache2/register/rewrite-rules.txt

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
