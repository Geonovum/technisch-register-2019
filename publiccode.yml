# De url naar de source code.
url: https://github.com/Geonovum/technisch-register-2019

# De url die gaat naar de website van het project
landingURL: https://register.geostandaarden.nl

# Type software zoals te vinden op: https://yml.publiccode.tools/schema.core.html#key-softwaretype
softwareType: standalone/web

# Vul hier in op welke platforms de gebruiker de applicatie uitendelijk gaat
# gebruiken. Dus niet op welk platform de software zelf draait.
platforms:
  - web

# De beschrijving van de verschillende statussen zijn te vinden op: https://yml.publiccode.tools/schema.core.html#key-developmentstatus
developmentStatus: stable

description:
  nl:
    # Mand! Maximaal 150 karakters
    shortDescription:
      Publiceert de technische bestanden van Nederlandse geo-standaarden automatisch vanuit GitHub op register.geostandaarden.nl.
    
    # Minimaal 150 karakters, max 10000
    longDescription: >
      Het technisch register is de centrale vindplaats voor de technische bestanden van de informatiemodellen uit het NEN3610-stelsel en andere Nederlandse geo-standaarden: UML-informatiemodellen, GML-applicatieschema's, XML- en JSON-schema's, SHACL-shapes, Schematron-regels, waardelijsten, WSDL's, visualisatieregels en symbolen. Het register wordt beheerd door Geonovum en draait op https://register.geostandaarden.nl. Beheerders van een standaard publiceren zelf, vanuit hun eigen GitHub-repository. Ze zetten de bestanden in een vaste mappenstructuur per artefacttype en maken een release. GitHub meldt de release via een ondertekende webhook aan het register, dat de zip van de release-tag ophaalt en de herkende mappen publiceert onder stabiele URL's per artefacttype, standaard en versie. Alleen repositories die in de configuratie zijn aangemeld kunnen publiceren, en alleen tags van die repository zelf. De website toont een overzicht van alle standaarden, pagina's per cluster van standaarden (zoals BRT en de RO-standaarden) en per standaard met de beschikbare artefacttypen, en directory listings van alle gepubliceerde bestanden. Welke standaarden, clusters en artefacttypen er zijn, staat in JSON-configuratiebestanden in deze repository; een wijziging daarin is na het mergen direct actief. De software bestaat uit een paar PHP-scripts voor Apache, zonder database.
    
    features:
        - Centrale vindplaats voor technische bestanden van geo-standaarden
        - Automatische publicatie vanuit GitHub bij elke release
        - Webhook met verplichte handtekening (webhookgeheim)
        - Alleen aangemelde repositories en hun eigen tags kunnen publiceren
        - Stabiele URL's per artefacttype, standaard en versie
        - Overzichtspagina's per cluster en per standaard
        - Directory listings van alle gepubliceerde bestanden
        - Alleen toegestane bestandstypen; uitvoerbare bestanden worden geweigerd
        - Configuratie van standaarden en artefacttypen in JSON op GitHub
        - Lokaal log van alle publicaties

